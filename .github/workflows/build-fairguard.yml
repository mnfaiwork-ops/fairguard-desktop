# FairGuard Desktop — build installer Windows (.exe)
#
# Kenapa hanya Windows: .deb x86_64 dibuild langsung di mesin Linux (lokal) via
#   pnpm build --linux deb --x64 --publish never
# .exe tidak bisa dibuild dari Linux, jadi dipakai runner windows-latest.
#
# Cara pakai:
#   - Otomatis saat push ke `fairguard` / PR  -> build tanpa publish (verifikasi).
#   - Push tag `v*` (mis. v7.2.3)             -> build + publish ke repo rilis.
#   - Manual (Actions -> Build -> Run workflow) juga bisa.
#
# PRASYARAT (sekali saja, di repo ini → Settings → Secrets and variables → Actions):
#   - GITHUB_TOKEN bawaan TIDAK cukup karena repo rilis BERBEDA.
#     Buat secret `RELEASE_TOKEN` (Personal Access Token klasik, scope `repo`)
#     milik akun mnfaiwork-ops yang punya akses ke fairguard-desktop-releases.

name: Build

on:
  push:
    branches:
      - fairguard
    tags:
      - 'v*'
  pull_request:
    branches:
      - fairguard
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matikan pencarian sertifikat code-sign (kita belum punya sertifikat).
  CSC_IDENTITY_AUTO_DISCOVERY: false
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
  # Hanya token ini yang boleh publish ke repo rilis kita.
  GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

jobs:
  build-windows:
    name: Windows (nsis + portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: pnpm

      - name: Cache electron / electron-builder
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package recipes (generate archives/ + all.json)
        # Recipe individual TIDAK di-commit (archives/ dan all.json di-gitignore);
        # mereka digenerate dari recipes/recipes/* sebelum build.
        working-directory: recipes
        shell: bash
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          node scripts/package.js

      - name: Build (publish on tag only)
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            pnpm build --win --publish always
          else
            pnpm build --win --publish never
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fairguard-windows
          if-no-files-found: error
          path: |
            out/*.exe
